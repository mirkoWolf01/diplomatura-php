<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clase 3 - Agenda de Contactos con ES6</title>
  <style>
    .contacto { border: 1px solid #ccc; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Agenda de Contactos</h1>
  <p>Abrí la consola (F12) para ver mensajes y errores.</p>

  <p>
    <label for="buscador">Buscar:</label>
    <input type="text" id="buscador" placeholder="Buscar contacto...">
  </p>

  <div id="listaContactos"></div>

  <hr>

  <h2>Agregar contacto</h2>
  <p>
    <label for="nuevoNombre">Nombre:</label>
    <input type="text" id="nuevoNombre">
  </p>
  <p>
    <label for="nuevoTelefono">Teléfono:</label>
    <input type="text" id="nuevoTelefono">
  </p>
  <p>
    <label for="nuevoEmail">Email (opcional):</label>
    <input type="text" id="nuevoEmail">
  </p>
  <p>
    <button type="button" id="btnAgregar">Agregar contacto</button>
  </p>

  <script src="script.js"></script>
</body>
</html>
