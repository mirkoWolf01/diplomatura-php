<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de contacto - XMLHttpRequest</title>
</head>
<body>
  <main>
    <h1>Formulario de contacto</h1>
    <p>Ejemplo resuelto con <code>XMLHttpRequest</code>. Las consultas se guardan en <code>consultas.xml</code>.</p>

    <form id="formularioContacto" novalidate>
      <p>
        <label for="nombre">Nombre *</label><br>
        <input id="nombre" name="nombre" type="text" required>
      </p>
      <p>
        <label for="apellido">Apellido *</label><br>
        <input id="apellido" name="apellido" type="text" required>
      </p>
      <p>
        <label for="telefono">Telefono</label><br>
        <input id="telefono" name="telefono" type="tel">
      </p>
      <p>
        <label for="email">Email *</label><br>
        <input id="email" name="email" type="email" required>
      </p>
      <p>
        <label for="tipoContacto">Tipo de contacto *</label><br>
        <select id="tipoContacto" name="tipoContacto" required>
          <option value="">Seleccionar...</option>
          <option value="soporte">Soporte</option>
          <option value="ventas">Ventas</option>
        </select>
      </p>
      <p>
        <label for="asunto">Asunto *</label><br>
        <input id="asunto" name="asunto" type="text" required>
      </p>
      <p>
        <label for="descripcion">Descripcion *</label><br>
        <textarea id="descripcion" name="descripcion" rows="5" required></textarea>
      </p>
      <button type="submit">Enviar consulta</button>
      <button type="button" id="btnError">Probar error AJAX</button>
    </form>

    <p id="resultado" role="status" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
